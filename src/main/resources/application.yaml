spring:
  application:
    name: ms-notificacao
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        socketFactory:
          port: 465
          class: javax.net.ssl.SSLSocketFactory
          fallback: false
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000
    thymeleaf:
      enabled: true

envio:
  email:
    remetente:
    nomeRemetente: 'Webber Chagas - MS Notificação'

server:
  port: 8082
